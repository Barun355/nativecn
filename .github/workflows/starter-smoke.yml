name: Starter smoke test

# `create` and `add` end to end against a locally built Registry (decision #31), on Expo SDK 57. Two ways in:
#   - called by ci.yml on PRs touching the CLI, packages/ui, the Starter or the Preset code: blocking
#     there, through ci.yml's `checks` job;
#   - nightly on main (and on demand): not blocking; a failure shows as a failed run.

on:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: SDK 57
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Starter smoke test
        run: node --no-warnings packages/cli/scripts/starter-smoke.ts --sdk 57

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  unrs-resolver: true

# Shared versions pinned to Expo SDK 57 (bundledNativeModules) so packages/ui and
# apps/showcase resolve a single react / react-native copy (research: expo-pnpm-monorepo).
catalog:
  expo: ~57.0.26
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  "@types/react": ~19.2.18
  typescript: ~6.0.3
  jest: ^29.7.0
  "@types/jest": ^29.5.14
  jest-expo: ~57.0.5
  "@testing-library/react-native": ^14.0.1
  test-renderer: ^1.3.0
